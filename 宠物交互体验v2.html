<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物交互体验 v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:linear-gradient(160deg,#faf6f0,#e8f0fa); color:#2c1f14;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    height:100vh; overflow:hidden; user-select:none; touch-action:none;
  }
  .app { max-width:440px; margin:0 auto; height:100vh; position:relative; padding:44px 16px 190px; overflow:hidden; }
  h1 { font-size:26px; font-weight:800; display:flex; align-items:center; gap:8px; }
  .sub { font-size:19px; color:#b09878; margin:6px 0 10px; }
  .sound-btn {
    position:absolute; right:16px; top:44px; padding:8px 14px; border-radius:20px; border:none;
    background:#fff; color:#c87a3a; font-size:20px; font-weight:700; box-shadow:0 2px 8px rgba(60,40,20,.08); cursor:pointer;
  }
  .stage {
    position:relative; height:300px; border-radius:24px; background:rgba(255,255,255,.6);
    border:1px solid rgba(180,140,100,.12); overflow:hidden;
  }
  .home {
    position:absolute; right:14px; bottom:14px; width:64px; height:64px; border-radius:20px;
    background:#fff; border:1px solid rgba(180,140,100,.15); display:flex; align-items:center; justify-content:center;
    font-size:34px; box-shadow:0 4px 12px rgba(60,40,20,.08);
  }
  .hint {
    position:absolute; left:12px; bottom:10px; font-size:18px; color:#b09878;
  }
  .panel {
    position:fixed; bottom:0; left:0; right:0; max-width:440px; margin:0 auto;
    background:rgba(255,255,250,.96); border-radius:24px 24px 0 0; padding:14px 16px 22px;
    box-shadow:0 -4px 20px rgba(60,40,20,.08); z-index:50;
  }
  .panel-row { display:flex; gap:10px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; }
  .panel-label { font-size:19px; color:#b09878; font-weight:700; margin-bottom:6px; }
  .pet-btn, .outfit-btn {
    flex-shrink:0; padding:10px 12px; border-radius:16px; border:2px solid transparent;
    background:#f5ede0; font-size:22px; font-weight:700; cursor:pointer; color:#5a4a3a;
    display:flex; flex-direction:column; align-items:center; gap:2px; min-width:64px;
  }
  .pet-btn .pe { font-size:30px; }
  .pet-btn.active, .outfit-btn.active { border-color:#c87a3a; background:#fff2e8; }
  .action-row { display:flex; gap:10px; }
  .action-btn {
    flex:1; padding:12px 0; border-radius:14px; border:none; font-size:20px; font-weight:700; cursor:pointer;
    background:#c87a3a; color:#fff;
  }
  .action-btn.ghost { background:#fff; color:#c87a3a; border:2px solid #c87a3a; }

  /* 宠物本体 */
  #pet {
    position:fixed; left:60%; top:42%; z-index:60;
    width:96px; height:96px; cursor:grab;
  }
  #pet:active { cursor:grabbing; }
  .pet-shell { position:relative; width:96px; height:96px; }
  .pet-bg {
    position:absolute; inset:0; border-radius:50%; background:#fff; box-shadow:0 6px 18px rgba(60,40,20,.15);
    transition: transform .25s ease;
  }
  .pet-emoji {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:66px;
  }
  .accessory {
    position:absolute; font-size:26px; pointer-events:none;
  }
  .speech {
    position:absolute; top:-34px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:12px; padding:5px 10px; font-size:18px; font-weight:700;
    color:#c87a3a; white-space:nowrap; box-shadow:0 2px 8px rgba(60,40,20,.12); opacity:0;
    transition: opacity .2s ease;
  }
  .speech.show { opacity:1; }

  /* 粒子 */
  .particle {
    position:absolute; left:50%; top:50%; pointer-events:none; z-index:5;
    font-size:22px; animation: fly 1s ease-out forwards;
  }
  @keyframes fly {
    0% { transform:translate(-50%,-50%) scale(.6); opacity:1; }
    100% { transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); opacity:0; }
  }
  .pet-shell.pop .pet-bg { animation: squash .4s ease; }
  .pet-shell.zap .pet-bg { animation: shake .45s ease; background:#fff9e0; }
  @keyframes squash { 0%,100%{transform:scale(1);} 35%{transform:scale(1.12,.9);} 70%{transform:scale(.92,1.08);} }
  @keyframes shake { 0%,100%{transform:translate(0);} 25%{transform:translate(-4px,2px);} 50%{transform:translate(4px,-2px);} 75%{transform:translate(-3px,-1px);} }

  /* 回城 */
  #pet.going-home { transition: all .9s cubic-bezier(.5,-.2,.7,1); }
  #pet.summoning { transition: all .9s cubic-bezier(.3,1.4,.5,1); }
</style>
</head>
<body>
<div class="app">
  <h1>🐣 宠物交互体验 v2</h1>
  <div class="sub">多种宠物 · 点一下卖萌 / 点两下放大招 · 声音可开关</div>
  <button class="sound-btn" id="soundBtn">🔊 声音开</button>

  <div class="stage">
    <div class="home" id="home">🏠</div>
    <div class="hint">点 1 下卖萌 · 快速点 2 下放大招</div>
  </div>
</div>

<div id="pet">
  <div class="speech" id="speech">你好呀～</div>
  <div class="pet-shell" id="shell">
    <div class="pet-bg" id="petBg"></div>
    <div class="pet-emoji" id="petEmoji">🐹</div>
    <div class="accessory" id="acc" style="top:-8px;left:34px;display:none;">🎀</div>
  </div>
</div>

<div class="panel">
  <div class="panel-label">选择宠物</div>
  <div class="panel-row" id="petRow">
    <button class="pet-btn active" data-pet="mouse"><span class="pe">⚡</span>电电鼠</button>
    <button class="pet-btn" data-pet="fish"><span class="pe">🐟</span>泡泡鱼</button>
    <button class="pet-btn" data-pet="dragon"><span class="pe">🐲</span>小火龙</button>
    <button class="pet-btn" data-pet="turtle"><span class="pe">🐢</span>水箭龟</button>
    <button class="pet-btn" data-pet="whale"><span class="pe">🐳</span>喷水鲸</button>
    <button class="pet-btn" data-pet="fox"><span class="pe">🦊</span>幻狐</button>
  </div>

  <div class="panel-label">换装</div>
  <div class="panel-row" id="outfitRow">
    <button class="outfit-btn active" data-outfit="none">无</button>
    <button class="outfit-btn" data-outfit="bow">🎀 蝴蝶结</button>
    <button class="outfit-btn" data-outfit="crown">👑 皇冠</button>
    <button class="outfit-btn" data-outfit="scarf">🧣 围巾</button>
    <button class="outfit-btn" data-outfit="glasses">🕶 墨镜</button>
  </div>

  <div class="action-row">
    <button class="action-btn" id="homeBtn">🏠 回城睡觉</button>
    <button class="action-btn ghost" id="summonBtn">✨ 召唤出来</button>
  </div>
</div>

<script>
  var pets = {
    mouse:  { emoji:'🐹', bg:'#fff6d8', cute:'皮卡皮卡～', special:'⚡ 十万伏特！', specialEmoji:'⚡', sound:'zap' },
    fish:   { emoji:'🐟', bg:'#d8f0ff', cute:'咕噜咕噜～', special:'🫧 泡泡攻击！', specialEmoji:'🫧', sound:'bubble' },
    dragon: { emoji:'🐲', bg:'#ffe0d8', cute:'嗷呜～', special:'🔥 喷火！', specialEmoji:'🔥', sound:'fire' },
    turtle: { emoji:'🐢', bg:'#d8f8e8', cute:'龟龟笑～', special:'💦 水枪喷射！', specialEmoji:'💦', sound:'water' },
    whale:  { emoji:'🐳', bg:'#d8e8ff', cute:'鲸鲸开心～', special:'🌊 喷水柱！', specialEmoji:'💦', sound:'water' },
    fox:    { emoji:'🦊', bg:'#f0e0ff', cute:'呜～', special:'✨ 幻光闪耀！', specialEmoji:'✨', sound:'magic' }
  };
  var currentPet = 'mouse';
  var soundOn = true;
  var tapTimer = null;

  var pet = document.getElementById('pet');
  var shell = document.getElementById('shell');
  var petBg = document.getElementById('petBg');
  var petEmoji = document.getElementById('petEmoji');
  var acc = document.getElementById('acc');
  var speech = document.getElementById('speech');

  function applyPet() {
    var p = pets[currentPet];
    petEmoji.textContent = p.emoji;
    petBg.style.background = p.bg;
    showSpeech(p.cute);
  }
  function showSpeech(t) {
    speech.textContent = t;
    speech.classList.add('show');
    clearTimeout(showSpeech._t);
    showSpeech._t = setTimeout(function(){ speech.classList.remove('show'); }, 1200);
  }
  function burst(emoji, count, dx, dy) {
    var shellEl = shell;
    for (var i=0;i<count;i++) {
      var s = document.createElement('span');
      s.className = 'particle';
      s.textContent = emoji;
      s.style.setProperty('--dx', (Math.random()*dx*2 - dx) + 'px');
      s.style.setProperty('--dy', (Math.random()*dy*2 - dy) + 'px');
      s.style.left = (40 + Math.random()*20) + '%';
      s.style.top = (30 + Math.random()*20) + '%';
      shellEl.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1000); })(s);
    }
  }
  function tapAction(special) {
    var p = pets[currentPet];
    if (special) {
      shell.classList.add('zap');
      showSpeech(p.special);
      burst(p.specialEmoji, 8, 70, 70);
      playSound(p.sound);
      setTimeout(function(){ shell.classList.remove('zap'); }, 500);
    } else {
      shell.classList.add('pop');
      showSpeech(p.cute);
      playSound('cute');
      setTimeout(function(){ shell.classList.remove('pop'); }, 450);
    }
  }
  pet.addEventListener('click', function() {
    if (tapTimer) {
      clearTimeout(tapTimer); tapTimer = null;
      tapAction(true);
    } else {
      tapAction(false);
      tapTimer = setTimeout(function(){ tapTimer = null; }, 350);
    }
  });

  // 拖动
  var dragging=false, offX=0, offY=0;
  pet.addEventListener('mousedown', start); document.addEventListener('mousemove', move); document.addEventListener('mouseup', end);
  pet.addEventListener('touchstart', start, {passive:false}); document.addEventListener('touchmove', move, {passive:false}); document.addEventListener('touchend', end);
  function start(e){ dragging=true; var p=e.touches?e.touches[0]:e; var r=pet.getBoundingClientRect(); offX=p.clientX-r.left; offY=p.clientY-r.top; e.preventDefault(); }
  function move(e){ if(!dragging) return; var p=e.touches?e.touches[0]:e; var x=p.clientX-offX, y=p.clientY-offY; x=Math.max(0,Math.min(window.innerWidth-96,x)); y=Math.max(0,Math.min(window.innerHeight-180,y)); pet.style.left=x+'px'; pet.style.top=y+'px'; e.preventDefault(); }
  function end(){ dragging=false; }

  // 换宠物
  document.getElementById('petRow').addEventListener('click', function(e){
    var btn = e.target.closest('.pet-btn'); if (!btn) return;
    document.querySelectorAll('.pet-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentPet = btn.getAttribute('data-pet');
    applyPet();
    if (pet.classList.contains('gone')) summonPet();
  });

  // 换装
  document.getElementById('outfitRow').addEventListener('click', function(e){
    var btn = e.target.closest('.outfit-btn'); if (!btn) return;
    document.querySelectorAll('.outfit-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    var o = btn.getAttribute('data-outfit');
    if (o === 'none') { acc.style.display='none'; }
    else { acc.style.display='block'; acc.textContent = btn.textContent.trim().split(' ')[0]; }
  });

  // 声音开关
  var soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊 声音开' : '🔇 声音关';
  });

  // 回城 / 召唤
  var homeBtn = document.getElementById('homeBtn');
  var summonBtn = document.getElementById('summonBtn');
  homeBtn.addEventListener('click', goHome);
  summonBtn.addEventListener('click', summonPet);

  function goHome() {
    var home = document.getElementById('home');
    var hr = home.getBoundingClientRect();
    pet.classList.add('going-home');
    pet.style.left = (hr.left + 14) + 'px';
    pet.style.top = (hr.top + 8) + 'px';
    pet.style.transform = 'rotate(720deg) scale(.05)';
    pet.style.opacity = '0';
    setTimeout(function(){ pet.classList.add('gone'); }, 950);
  }
  function summonPet() {
    var home = document.getElementById('home');
    var hr = home.getBoundingClientRect();
    pet.classList.remove('gone');
    pet.classList.remove('going-home');
    pet.style.transition = 'none';
    pet.style.left = (hr.left + 14) + 'px';
    pet.style.top = (hr.top + 8) + 'px';
    pet.style.transform = 'rotate(0deg) scale(.05)';
    pet.style.opacity = '0';
    requestAnimationFrame(function() {
      pet.style.transition = 'all .9s cubic-bezier(.3,1.4,.5,1)';
      pet.style.left = '60%';
      pet.style.top = '42%';
      pet.style.transform = 'rotate(0deg) scale(1)';
      pet.style.opacity = '1';
    });
    applyPet();
  }

  // 简单合成音效
  var ctx = null;
  function ac(){ if (!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
  function playSound(kind) {
    if (!soundOn) return;
    var c = ac();
    var t = c.currentTime;
    function tone(freq, start, dur, type, vol) {
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t+start);
      g.gain.linearRampToValueAtTime(vol || .15, t+start+.02);
      g.gain.exponentialRampToValueAtTime(.001, t+start+dur);
      o.connect(g); g.connect(c.destination);
      o.start(t+start); o.stop(t+start+dur+.05);
    }
    function noise(start, dur, vol) {
      var buf = c.createBuffer(1, c.sampleRate*dur, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
      var src = c.createBufferSource(); src.buffer = buf;
      var g = c.createGain(); g.gain.value = vol || .15;
      src.connect(g); g.connect(c.destination); src.start(t+start);
    }
    if (kind === 'cute') { tone(880,.0,.15,'sine',.12); tone(1320,.08,.18,'sine',.1); }
    if (kind === 'zap') { tone(1800,.0,.08,'sawtooth',.08); tone(1200,.06,.1,'sawtooth',.08); noise(.0,.15,.12); }
    if (kind === 'bubble') { tone(400,.0,.1,'sine',.12); tone(600,.12,.1,'sine',.12); tone(800,.24,.12,'sine',.12); }
    if (kind === 'fire') { noise(.0,.4,.2); tone(200,.0,.3,'sawtooth',.05); }
    if (kind === 'water') { noise(.0,.5,.18); tone(300,.0,.4,'sine',.06); }
    if (kind === 'magic') { tone(1200,.0,.3,'sine',.1); tone(1600,.1,.4,'sine',.08); tone(2000,.2,.5,'sine',.06); }
  }

  applyPet();
</script>
</body>
</html>
