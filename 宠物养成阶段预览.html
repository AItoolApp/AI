<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宠物养成阶段预览 · 泡泡玛特风</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:linear-gradient(170deg,#fdf6f0,#f3ecfa); color:#2c1f14;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    max-width:440px; margin:0 auto; padding:40px 16px 80px;
  }
  h1 { font-size:28px; font-weight:800; }
  .sub { font-size:20px; color:#b09878; margin:6px 0 20px; line-height:1.5; }
  .card {
    background:rgba(255,255,255,.9); border-radius:24px; padding:20px; margin-bottom:18px;
    border:1px solid rgba(180,140,100,.12); box-shadow:0 4px 16px rgba(60,40,20,.06);
  }
  .card h2 { font-size:24px; font-weight:800; margin-bottom:10px; }
  .stage { height:230px; border-radius:20px; display:flex; align-items:center; justify-content:center; gap:18px; position:relative; overflow:hidden; }
  .nest-bg { background:linear-gradient(180deg,#fdeef0,#fff); }
  .egg-bg { background:linear-gradient(180deg,#fff7e8,#fff); }
  .stage .label { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:18px; color:#b09878; }
  .btn {
    margin-top:12px; padding:12px 16px; border:none; border-radius:16px; background:#c87a3a; color:#fff;
    font-size:20px; font-weight:700; cursor:pointer;
  }
  .btn.ghost { background:#fff; color:#c87a3a; border:2px solid #c87a3a; }
</style>
</head>
<body>
  <h1>🐣 宠物养成阶段预览</h1>
  <div class="sub">泡泡玛特风：圆润、哑光、柔和渐变、治愈。先看蛋→孵化→小窝围观的感觉。</div>

  <!-- 蛋 -->
  <div class="card">
    <h2>阶段 1 · 灵宠蛋</h2>
    <div class="stage egg-bg">
      <svg width="140" height="150" viewBox="0 0 100 110">
        <defs>
          <linearGradient id="eggG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff7ec"/><stop offset="1" stop-color="#fde4d4"/>
          </linearGradient>
        </defs>
        <ellipse cx="50" cy="65" rx="30" ry="38" fill="url(#eggG)" stroke="#f3cdb8" stroke-width="1.5"/>
        <ellipse cx="38" cy="60" rx="6" ry="4" fill="#f8b8a8" opacity=".6" transform="rotate(-15 38 60)"/>
        <ellipse cx="62" cy="64" rx="6" ry="4" fill="#f8b8a8" opacity=".6" transform="rotate(10 62 64)"/>
        <circle cx="46" cy="48" r="2" fill="#3a2a2a"/>
        <circle cx="56" cy="48" r="2" fill="#3a2a2a"/>
        <path d="M48 53 Q51 55 54 53" stroke="#3a2a2a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="label">每天打卡积累孵化值，21 点孵化</div>
    </div>
  </div>

  <!-- 孵化 -->
  <div class="card">
    <h2>阶段 2 · 孵化（裂纹+光）</h2>
    <div class="stage egg-bg">
      <svg width="150" height="160" viewBox="0 0 100 110">
        <ellipse cx="50" cy="65" rx="30" ry="38" fill="#fff7ec" stroke="#f3cdb8" stroke-width="1.5"/>
        <path d="M48 32 L50 42 L43 48 M55 30 L52 40 L60 46" stroke="#e8a87c" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M46 48 L50 56 L45 62" stroke="#e8a87c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="52" r="8" fill="#ffe9a8" opacity=".7"/>
        <circle cx="50" cy="52" r="4" fill="#fff6d8"/>
        <ellipse cx="37" cy="61" rx="5" ry="3.5" fill="#f8b8a8" opacity=".5" transform="rotate(-15 37 61)"/>
        <ellipse cx="63" cy="65" rx="5" ry="3.5" fill="#f8b8a8" opacity=".5" transform="rotate(10 63 65)"/>
      </svg>
      <div class="label">裂纹发光中… 随机孵化一只小可爱</div>
    </div>
  </div>

  <!-- 小窝围观 -->
  <div class="card">
    <h2>阶段 3 · 小窝围观（睡觉可看）</h2>
    <div class="stage nest-bg" id="nestStage">
      <svg width="220" height="170" viewBox="0 0 160 120">
        <defs>
          <linearGradient id="nestG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe9f0"/><stop offset="1" stop-color="#fdeef0"/>
          </linearGradient>
        </defs>
        <!-- 展示盒 -->
        <rect x="15" y="14" width="130" height="90" rx="18" fill="url(#nestG)" stroke="#f3cdd8" stroke-width="1.5"/>
        <rect x="15" y="14" width="130" height="18" rx="9" fill="#fff" opacity=".7"/>
        <!-- 底座 -->
        <ellipse cx="80" cy="96" rx="52" ry="10" fill="#f3cdd8"/>
        <!-- 睡觉宠物 -->
        <ellipse cx="80" cy="74" rx="22" ry="18" fill="#fff" stroke="#f3cdd8" stroke-width="2"/>
        <path d="M66 70 Q66 66 71 66" stroke="#3a2a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M89 70 Q89 66 94 66" stroke="#3a2a2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="63" cy="74" rx="4" ry="2.6" fill="#f8b8c8" opacity=".6"/>
        <ellipse cx="97" cy="74" rx="4" ry="2.6" fill="#f8b8c8" opacity=".6"/>
        <text x="108" y="52" font-size="11" fill="#c9a0b0">Zzz</text>
      </svg>
      <div class="label">点「围观」打开窝内视角 · 点「叫醒」出来陪伴</div>
    </div>
    <button class="btn" id="peekBtn">👀 围观睡姿</button>
    <button class="btn ghost" id="wakeBtn">☀️ 叫醒出来</button>
  </div>

<script>
  var peekBtn = document.getElementById('peekBtn');
  var wakeBtn = document.getElementById('wakeBtn');
  peekBtn.addEventListener('click', function() {
    var stage = document.getElementById('nestStage');
    stage.innerHTML = '<div style="text-align:center;color:#8a5a2a;font-size:20px;line-height:1.6;">👀 窝内视角<br>小可爱正缩成一团睡觉，<br>呼吸起伏中～ Zzz</div>';
  });
  wakeBtn.addEventListener('click', function() {
    var stage = document.getElementById('nestStage');
    stage.innerHTML = '<div style="text-align:center;font-size:44px;">🐣✨<br><span style="font-size:20px;color:#8a5a2a;">伸个懒腰，跳出来陪你啦！</span></div>';
  });
</script>
</body>
</html>
